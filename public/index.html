<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Выбор читателя</title>
</head>
<body>
  <h1>Сервис для отображения списка книг читателя</h1>
  <form method="GET" action="/books">
    <label>Выберите читателя:</label>
    <select name="reader">
      <option>Иванов И.И.</option>
      <option>Петров П.П.</option>
      <option>Сидоров С.С.</option>
    </select>
    <button type="submit">Получить список книг</button>
  </form>
</body>
</html>
